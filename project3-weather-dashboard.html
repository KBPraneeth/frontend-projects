<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Skies — Weather Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a1628;
      --surface: rgba(255,255,255,0.04);
      --surface2: rgba(255,255,255,0.07);
      --text: #e8f0fe;
      --muted: rgba(232,240,254,0.45);
      --accent: #60a5fa;
      --accent2: #93c5fd;
      --warm: #fbbf24;
      --border: rgba(255,255,255,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      padding: 32px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background-image:
        radial-gradient(ellipse at 30% 0%, rgba(96,165,250,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(139,92,246,0.08) 0%, transparent 50%);
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    /* Search */
    .search-wrap {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .search-input {
      flex: 1;
      padding: 14px 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
      backdrop-filter: blur(10px);
    }

    .search-input::placeholder { color: var(--muted); }

    .search-input:focus {
      border-color: var(--accent);
      background: rgba(255,255,255,0.09);
      box-shadow: 0 0 0 3px rgba(96,165,250,0.15);
    }

    .search-btn {
      padding: 14px 22px;
      background: var(--accent);
      color: #0a1628;
      border: none;
      border-radius: 14px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .search-btn:hover { background: var(--accent2); transform: translateY(-1px); }
    .search-btn:active { transform: scale(0.97); }
    .search-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Main card */
    .main-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      backdrop-filter: blur(20px);
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .main-card::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(96,165,250,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .location-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .location-name {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
    }

    .location-country {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    .local-time {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--accent);
      text-align: right;
    }

    .temp-row {
      display: flex;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 20px;
    }

    .temp-main {
      font-family: 'Space Mono', monospace;
      font-size: 80px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      letter-spacing: -2px;
    }

    .temp-unit {
      font-size: 28px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .weather-icon-wrap {
      margin-left: auto;
      text-align: center;
    }

    .weather-icon { font-size: 72px; line-height: 1; display: block; }

    .weather-desc {
      font-size: 15px;
      color: var(--muted);
      text-transform: capitalize;
      margin-top: 4px;
    }

    .feels-like {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .stat-box-label {
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 6px;
    }

    .stat-box-value {
      font-family: 'Space Mono', monospace;
      font-size: 20px;
      color: var(--text);
      font-weight: 700;
    }

    .stat-box-unit {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Forecast row */
    .forecast-row {
      display: flex;
      gap: 10px;
      animation: fadeUp 0.5s 0.1s ease both;
    }

    .forecast-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 10px;
      text-align: center;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }

    .forecast-card:hover {
      background: var(--surface2);
      transform: translateY(-2px);
    }

    .forecast-day {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 8px;
    }

    .forecast-icon { font-size: 28px; margin-bottom: 8px; }

    .forecast-temp-high {
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      color: var(--text);
      font-weight: 700;
    }

    .forecast-temp-low {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* States */
    .error-msg {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 12px;
      padding: 14px 18px;
      color: #fca5a5;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    .loading-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 60px 32px;
      text-align: center;
      display: none;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { color: var(--muted); font-size: 14px; }

    .results { display: none; }

    .api-note {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      margin-top: 16px;
      letter-spacing: 0.3px;
      line-height: 1.6;
    }

    .api-note a { color: var(--accent); text-decoration: none; }
    .api-note a:hover { text-decoration: underline; }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(96,165,250,0.12);
      border: 1px solid rgba(96,165,250,0.2);
      border-radius: 6px;
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 0.5px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .app-title {
      font-family: 'Space Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .app-subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="tag">PROJECT 3 · HTML CSS JS</div>
    <div class="app-title">SKIES</div>
    <p class="app-subtitle">Real-time weather dashboard · Fetch API · OpenWeather</p>

    <div class="search-wrap">
      <input class="search-input" id="cityInput" type="text" placeholder="Search city... e.g. Bengaluru, Tokyo" />
      <button class="search-btn" id="searchBtn">Search</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="loading-card" id="loadingCard">
      <div class="spinner"></div>
      <div class="loading-text">Fetching weather data...</div>
    </div>

    <div class="results" id="results">
      <div class="main-card">
        <div class="location-row">
          <div>
            <div class="location-name" id="cityName">—</div>
            <div class="location-country" id="countryName">—</div>
          </div>
          <div class="local-time" id="localTime">—</div>
        </div>

        <div class="temp-row">
          <div>
            <span class="temp-main" id="tempMain">—</span><span class="temp-unit">°C</span>
          </div>
          <div class="weather-icon-wrap">
            <span class="weather-icon" id="weatherIcon">—</span>
          </div>
        </div>
        <div class="weather-desc" id="weatherDesc">—</div>
        <div class="feels-like" id="feelsLike">—</div>

        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-box-label">Humidity</div>
            <div class="stat-box-value" id="humidity">—</div>
            <div class="stat-box-unit">percent</div>
          </div>
          <div class="stat-box">
            <div class="stat-box-label">Wind</div>
            <div class="stat-box-value" id="wind">—</div>
            <div class="stat-box-unit">km/h</div>
          </div>
          <div class="stat-box">
            <div class="stat-box-label">Visibility</div>
            <div class="stat-box-value" id="visibility">—</div>
            <div class="stat-box-unit">km</div>
          </div>
        </div>
      </div>

      <div class="forecast-row" id="forecastRow"></div>
    </div>

    <div class="api-note">
      Uses <a href="https://openweathermap.org/api" target="_blank">OpenWeatherMap API</a> (free tier) · 
      Replace <code>YOUR_API_KEY</code> in the JS with your key ·
      <a href="https://openweathermap.org/api" target="_blank">Get free key →</a>
    </div>
  </div>

  <script>
    // ⚠️ Replace with your free OpenWeatherMap API key: https://openweathermap.org/api
    const API_KEY = 'YOUR_API_KEY';

    const weatherIcons = {
      '01d': '☀️', '01n': '🌙', '02d': '⛅', '02n': '🌥️',
      '03d': '☁️', '03n': '☁️', '04d': '☁️', '04n': '☁️',
      '09d': '🌧️', '09n': '🌧️', '10d': '🌦️', '10n': '🌧️',
      '11d': '⛈️', '11n': '⛈️', '13d': '❄️', '13n': '❄️',
      '50d': '🌫️', '50n': '🌫️',
    };

    const DEMO_DATA = {
      name: 'Bengaluru', country: 'IN', temp: 28, feels_like: 31,
      desc: 'partly cloudy', icon: '02d', humidity: 65, wind: 14, visibility: 8,
      forecast: [
        { day: 'Tue', icon: '10d', high: 29, low: 22 },
        { day: 'Wed', icon: '11d', high: 26, low: 20 },
        { day: 'Thu', icon: '01d', high: 32, low: 23 },
        { day: 'Fri', icon: '02d', high: 30, low: 21 },
        { day: 'Sat', icon: '01d', high: 33, low: 24 },
      ]
    };

    function showLoading(v) {
      document.getElementById('loadingCard').style.display = v ? 'block' : 'none';
      document.getElementById('results').style.display = 'none';
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
      showLoading(false);
    }

    function clearError() {
      document.getElementById('errorMsg').style.display = 'none';
    }

    function getLocalTime(offsetSeconds) {
      const utc = Date.now() + new Date().getTimezoneOffset() * 60000;
      const local = new Date(utc + offsetSeconds * 1000);
      return local.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    function renderWeather(data) {
      document.getElementById('cityName').textContent = data.name;
      document.getElementById('countryName').textContent = `${data.country} · Lat/Lon varies`;
      document.getElementById('localTime').innerHTML = data.time ? `🕐 ${data.time}` : '';
      document.getElementById('tempMain').textContent = Math.round(data.temp);
      document.getElementById('weatherIcon').textContent = weatherIcons[data.icon] || '🌤️';
      document.getElementById('weatherDesc').textContent = data.desc;
      document.getElementById('feelsLike').textContent = `Feels like ${Math.round(data.feels_like)}°C`;
      document.getElementById('humidity').textContent = data.humidity + '%';
      document.getElementById('wind').textContent = Math.round(data.wind * 3.6);
      document.getElementById('visibility').textContent = (data.visibility / 1000).toFixed(1);

      const row = document.getElementById('forecastRow');
      row.innerHTML = data.forecast.map(f => `
        <div class="forecast-card">
          <div class="forecast-day">${f.day}</div>
          <div class="forecast-icon">${weatherIcons[f.icon] || '🌤️'}</div>
          <div class="forecast-temp-high">${f.high}°</div>
          <div class="forecast-temp-low">${f.low}°</div>
        </div>
      `).join('');

      document.getElementById('loadingCard').style.display = 'none';
      document.getElementById('results').style.display = 'block';
    }

    async function fetchWeather(city) {
      if (API_KEY === 'YOUR_API_KEY') {
        // Demo mode
        showLoading(true);
        await new Promise(r => setTimeout(r, 800));
        showLoading(false);
        renderWeather(DEMO_DATA);
        return;
      }

      try {
        showLoading(true);
        clearError();

        const [currentRes, forecastRes] = await Promise.all([
          fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric`),
          fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric`)
        ]);

        if (!currentRes.ok) {
          if (currentRes.status === 404) throw new Error(`City "${city}" not found. Try another name.`);
          throw new Error('Failed to fetch weather. Check your API key.');
        }

        const current = await currentRes.json();
        const forecast = await forecastRes.json();

        const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        const dailyMap = {};
        forecast.list.forEach(item => {
          const date = new Date(item.dt * 1000);
          const day = days[date.getDay()];
          if (!dailyMap[day]) dailyMap[day] = { high: -999, low: 999, icon: item.weather[0].icon };
          dailyMap[day].high = Math.max(dailyMap[day].high, item.main.temp_max);
          dailyMap[day].low = Math.min(dailyMap[day].low, item.main.temp_min);
        });

        const forecastArr = Object.entries(dailyMap).slice(0, 5).map(([day, v]) => ({
          day, icon: v.icon, high: Math.round(v.high), low: Math.round(v.low)
        }));

        renderWeather({
          name: current.name,
          country: current.sys.country,
          time: getLocalTime(current.timezone),
          temp: current.main.temp,
          feels_like: current.main.feels_like,
          desc: current.weather[0].description,
          icon: current.weather[0].icon,
          humidity: current.main.humidity,
          wind: current.wind.speed,
          visibility: current.visibility,
          forecast: forecastArr
        });

      } catch (err) {
        showError('⚠️ ' + err.message);
        showLoading(false);
      }
    }

    document.getElementById('searchBtn').addEventListener('click', () => {
      const city = document.getElementById('cityInput').value.trim();
      if (!city) return;
      fetchWeather(city);
    });

    document.getElementById('cityInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('searchBtn').click();
    });

    // Load demo on start
    fetchWeather('Bengaluru');
  </script>
</body>
</html>
